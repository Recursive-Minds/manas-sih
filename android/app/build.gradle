plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.recursiveminds.idr'
    compileSdk 34

    defaultConfig {
        applicationId "com.recursiveminds.idr"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [appLabel: "SIH IDR"]
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    flavorDimensions += "mode"
    productFlavors {
        server {
            dimension "mode"
            manifestPlaceholders = [appLabel: "SIH IDR"]
        }
        ondevice {
            dimension "mode"
            applicationIdSuffix ".ondevice"
            manifestPlaceholders = [appLabel: "IDR On-Device"]
            python {
                version "3.11"
                pip {
                    install "numpy"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // TFLite runtime for high-performance edge velocity inference
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    // osmdroid for OpenStreetMap rendering (no Google Play / API keys)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    
    // OkHttp for WebSocket connection to server
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
}
